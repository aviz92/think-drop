[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "think-drop"
version = "0.1.8"
description = "A Python package for building Telegram bots with ease and efficiency."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["cli", "command", "telegram", "bot", "integration", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "anthropic>=2.3.0",
    "custom-python-logger>=4.2.0",
    "google-genai>=2.34.0",
    "openai>=3.42.0",
    "pydantic-settings>=2.16.2",
    "python-base-toolkit>=1.2.1",
    "python-notion-plus>=1.1.1",
    "python-telegram-bot>=22.8",
    "pytz>=2026.6",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-better-report>=1.0.3",
]

[project.urls]
Homepage = "https://github.com/aviz92/think-drop"
Repository = "https://github.com/aviz92/think-drop"
Issues = "https://github.com/aviz92/think-drop/issues"

[tool.hatch.build.targets.wheel]
packages = ["think_drop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
